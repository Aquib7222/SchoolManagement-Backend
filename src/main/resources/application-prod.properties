spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


# Tomcat multipart parts
server.tomcat.max-part-count=50
server.tomcat.max-parameter-count=1000
spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true


cloudflare.r2.account-id=${CLOUDFLARE_ACCOUNT_ID}
cloudflare.r2.access-key-id=${R2_ACCESS_KEY_ID}
cloudflare.r2.secret-access-key=${R2_SECRET_ACCESS_KEY}
cloudflare.r2.bucket-name=${R2_BUCKET_NAME}


cloudflare.files-r2.account-id=${CLOUDFLARE_ACCOUNT_ID}
cloudflare.files-r2.access-key-id=${FILES_R2_ACCESS_KEY_ID}
cloudflare.files-r2.secret-access-key=${FILES_R2_SECRET_ACCESS_KEY}
cloudflare.files-r2.bucket-name=${FILES_R2_BUCKET_NAME}